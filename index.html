<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Havířov Floorball 0.6</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020508;font-family:Arial,Helvetica,sans-serif}
body{touch-action:none}
#app{position:fixed;inset:0;background:#020508;overflow:hidden}
#rinkSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#score{
 position:absolute;top:14px;left:50%;transform:translateX(-50%);
 width:min(720px,72vw);height:70px;border-radius:14px;
 background:linear-gradient(180deg,#111a23f5,#050a0ff5);
 border:1px solid #ffffff22;box-shadow:0 12px 40px #000b;
 display:flex;align-items:center;justify-content:center;gap:25px;color:#fff
}
.team{font-weight:900;letter-spacing:2px;font-size:18px}.blue{color:#55aaff}.yellow{color:#f4dc32}
.sc{font-size:38px;font-weight:1000;min-width:35px;text-align:center}.clock{font-size:22px;font-weight:900;color:#dbe2e7}
#joystick{position:absolute;left:28px;bottom:28px;width:160px;height:160px;border-radius:50%;
 background:radial-gradient(circle,#1d2a35 0 35%,#0a151f 36% 66%,#050b11 67%);
 border:2px solid #ffffff30;box-shadow:0 10px 35px #000b;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%);
 border-radius:50%;background:linear-gradient(145deg,#e5e9eb,#626a70);border:1px solid #fff8;box-shadow:0 6px 18px #000c}
.btn{position:absolute;border:1px solid #ffffff55;border-radius:50%;color:#fff;font-weight:1000;text-shadow:0 2px 6px #000;box-shadow:0 8px 28px #000b;pointer-events:auto}
#pass{right:175px;bottom:112px;width:84px;height:84px;background:radial-gradient(circle at 35% 25%,#67b8fa,#174f88 75%)}
#switch{right:34px;bottom:205px;width:68px;height:68px;background:#27323eee}
#check{right:155px;bottom:27px;width:68px;height:68px;background:#77831de8}
#shoot{right:30px;bottom:25px;width:124px;height:124px;background:radial-gradient(circle at 35% 25%,#fa5b63,#90151d 75%);font-size:15px}
#power{position:absolute;right:176px;bottom:82px;width:88px;height:8px;border-radius:8px;background:#000b;border:1px solid #fff4;overflow:hidden}
#powerFill{height:100%;width:0;background:#fff}
#hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:10px;color:#ffffff40;white-space:nowrap}
#portrait{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#16242f,#020508 75%);color:#fff}
#portrait .card{padding:32px;width:min(90%,430px);border:1px solid #ffffff22;border-radius:20px;background:#071018ee}
#portrait .icon{font-size:58px}#portrait h2{margin:8px 0;font-size:24px}#portrait p{margin:0;color:#aeb9c1;font-size:13px}
#menu,#end{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#163849,#020508 72%);color:#fff}
.card{width:min(580px,88vw);padding:35px;text-align:center;background:#071018ef;border:1px solid #ffffff24;border-radius:22px;box-shadow:0 30px 100px #000d}
.logo{font-size:46px;font-weight:1000;line-height:.9;letter-spacing:-2px}.sub{margin-top:12px;color:#9daab3;font-size:12px;letter-spacing:3px}
.match{margin:28px 0 8px;font-size:25px;font-weight:1000}.start{margin-top:22px;border:0;border-radius:9px;padding:14px 34px;background:#f3f5f6;color:#071018;font-weight:1000;font-size:16px}
#end{display:none}.final{font-size:64px;font-weight:1000;margin:14px}
@media (orientation:portrait){
 #ui,#rinkSvg{display:none}
 #portrait{display:flex}
}
</style>
</head>
<body>
<div id="app">
<svg id="rinkSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="florbalové hřiště">
<defs>
 <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcecf5"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#dcecf5"/></linearGradient>
 <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1f3f3"/><stop offset="1" stop-color="#8d969b"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="1600" height="900" fill="#020508"/>
<!-- arena -->
<rect x="0" y="0" width="1600" height="95" fill="#111a21"/>
<g opacity=".35" fill="#82909a"><circle cx="60" cy="45" r="22"/><circle cx="130" cy="30" r="15"/><circle cx="1490" cy="35" r="18"/><circle cx="1550" cy="55" r="24"/></g>
<rect x="48" y="105" width="1504" height="690" rx="58" fill="#000" opacity=".65" filter="url(#shadow)"/>
<rect x="55" y="95" width="1490" height="700" rx="58" fill="url(#ice)" stroke="#e8ecee" stroke-width="8"/>
<rect x="63" y="103" width="1474" height="684" rx="51" fill="none" stroke="#b7c1c5" stroke-width="4"/>
<!-- ice stripes -->
<g opacity=".12">
 <rect x="95" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="190" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="285" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="380" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="475" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="570" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="665" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="760" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="855" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="950" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="1045" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="1140" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="1235" y="105" width="45" height="680" fill="#7ba9c0"/><rect x="1330" y="105" width="45" height="680" fill="#7ba9c0"/>
 <rect x="1425" y="105" width="45" height="680" fill="#7ba9c0"/>
</g>
<!-- boards -->
<path d="M55 145 Q55 95 105 95 H1495 Q1545 95 1545 145" fill="none" stroke="#f7f8f8" stroke-width="10"/>
<path d="M55 745 Q55 795 105 795 H1495 Q1545 795 1545 745" fill="none" stroke="#f7f8f8" stroke-width="10"/>
<rect x="55" y="95" width="1490" height="10" fill="#f0cf25"/><rect x="55" y="785" width="1490" height="10" fill="#f0cf25"/>
<!-- markings -->
<line x1="800" y1="105" x2="800" y2="785" stroke="#c92a35" stroke-width="5"/>
<line x1="495" y1="105" x2="495" y2="785" stroke="#2d64b6" stroke-width="7"/>
<line x1="1105" y1="105" x2="1105" y2="785" stroke="#2d64b6" stroke-width="7"/>
<g fill="none" stroke="#c92a35" stroke-width="4">
 <circle cx="800" cy="445" r="65"/><circle cx="495" cy="445" r="48"/><circle cx="1105" cy="445" r="48"/>
 <circle cx="210" cy="275" r="48"/><circle cx="210" cy="615" r="48"/><circle cx="1390" cy="275" r="48"/><circle cx="1390" cy="615" r="48"/>
</g>
<g fill="#c92a35"><circle cx="800" cy="445" r="5"/><circle cx="495" cy="445" r="5"/><circle cx="1105" cy="445" r="5"/></g>
<!-- goal creases and goals -->
<g fill="#d7e7ee" stroke="#5a7c8e" stroke-width="3">
 <path d="M75 365 Q150 445 75 525 L75 365Z"/><path d="M1525 365 Q1450 445 1525 525 L1525 365Z"/>
</g>
<g fill="none" stroke="#d33a3f" stroke-width="7"><path d="M68 360 Q150 445 68 530"/><path d="M1532 360 Q1450 445 1532 530"/></g>
<!-- players, intentionally modest size -->
<g id="players"></g>
<g id="puck"><ellipse cx="800" cy="450" rx="9" ry="5" fill="#0008"/><circle cx="800" cy="446" r="7" fill="#171a1c"/></g>
</svg>

<div id="ui">
 <div id="score"><span class="team blue">SLOVAN</span><span class="sc" id="bs">0</span><span class="clock" id="clock">03:00</span><span class="sc" id="ys">0</span><span class="team yellow">TORPÉDO</span></div>
 <div id="joystick"><div id="knob"></div></div>
 <button class="btn" id="pass">PASS</button><button class="btn" id="switch">HRÁČ</button><button class="btn" id="check">TLAK</button><button class="btn" id="shoot">STŘELA</button>
 <div id="power"><div id="powerFill"></div></div>
 <div id="hint">JOYSTICK = POHYB • PASS = PŘIHRÁVKA • STŘELA = NABIJET • HRÁČ = PŘEPNOUT</div>
</div>

<div id="portrait"><div class="card"><div class="icon">↻</div><h2>Otoč telefon na šířku</h2><p>Hra je navržená jako klasická konzolová sportovní hra.</p></div></div>

<div id="menu"><div class="card"><div class="logo">HAVÍŘOV<br>FLOORBALL</div><div class="sub">RETRO CONSOLE EDITION</div><div class="match"><span class="blue">SLOVAN</span> × <span class="yellow">TORPÉDO</span></div><button class="start" id="start">ZAČÍT ZÁPAS</button></div></div>
<div id="end"><div class="card"><div class="sub">KONEC ZÁPASU</div><div class="final" id="final">0 : 0</div><div id="result"></div><button class="start" id="again">HRÁT ZNOVU</button></div></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg',playersEl=document.getElementById('players'),puckEl=document.getElementById('puck');
const rink={x:55,y:95,w:1490,h:700},midX:800;
let players=[],controlled=null,owner=null,running=false,time=180,blue=0,yellow=0,charge=0;
const input={x:0,y:0};
function svg(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function player(team,x,y,num,role='F'){return {team,x,y,num,role,homeX:x,homeY:y,speed:230,dir:team==='blue'?1:-1,g:null}}
function make(){
 players=[
 player('blue',145,445,1,'GK'),player('blue',390,275,7),player('blue',420,445,17),player('blue',390,615,21),player('blue',620,445,4),
 player('yellow',1455,445,1,'GK'),player('yellow',1210,275,3),player('yellow',1180,445,11),player('yellow',1210,615,19),player('yellow',980,445,5)
 ];
 playersEl.innerHTML='';
 for(const p of players){
  const g=svg('g');g.setAttribute('transform',`translate(${p.x} ${p.y})`);
  g.append(svg('ellipse',{cx:3,cy:24,rx:24,ry:8,fill:'#0006'}));
  g.append(svg('rect',{x:-13,y:12,width:10,height:18,rx:4,fill:'#10151a'}),svg('rect',{x:3,y:12,width:10,height:18,rx:4,fill:'#10151a'}));
  const body=svg('ellipse',{cx:0,cy:0,rx:20,ry:26,stroke:'#111a', 'stroke-width':2});
  body.setAttribute('fill',p.team==='blue'?'#2476d0':'#e0c523');g.append(body);
  g.append(svg('circle',{cx:0,cy:-29,r:10,fill:'#d7ad8b'}));
  g.append(svg('path',{d:'M-11 -31 Q0 -43 11 -31',fill:p.team==='blue'?'#092653':'#171717'}));
  g.append(svg('text',{x:0,y:5,'text-anchor':'middle','font-size':11,'font-weight':900,fill:p.team==='blue'?'#fff':'#111'}));g.lastChild.textContent=p.num;
  g.append(svg('line',{x:p.dir*7,y:7,x2:p.dir*39,y2:27,stroke:'#efe5c8','stroke-width':4,'stroke-linecap':'round'}));
  g.append(svg('line',{x:p.dir*39,y:27,x2:p.dir*47,y2:24,stroke:'#efe5c8','stroke-width':3}));
  playersEl.append(g);p.g=g;
 }
 owner=players[2];controlled=players[2];updatePuck();
}
function updatePuck(){
 if(owner){puckEl.setAttribute('transform',`translate(${owner.x+(owner.team==='blue'?27:-27)} ${owner.y+4})`)}
}
function movePlayer(p,tx,ty,dt,fac=.55){
 let dx=tx-p.x,dy=ty-p.y,l=Math.hypot(dx,dy);if(l>3){p.x+=dx/l*p.speed*fac*dt;p.y+=dy/l*p.speed*fac*dt;p.dir=dx>=0?1:-1}
 p.x=Math.max(rink.x+35,Math.min(rink.x+rink.w-35,p.x));p.y=Math.max(rink.y+35,Math.min(rink.y+rink.h-35,p.y));
 p.g.setAttribute('transform',`translate(${p.x} ${p.y})`);
}
function update(dt){
 if(!running)return;
 time-=dt;if(time<=0){time=0;running=false;document.getElementById('final').textContent=`${blue} : ${yellow}`;document.getElementById('result').textContent=blue>yellow?'VYHRÁL SLOVAN':yellow>blue?'VYHRÁLO TORPÉDO':'REMÍZA';document.getElementById('end').style.display='flex';return}
 document.getElementById('clock').textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')}`;
 let l=Math.hypot(input.x,input.y);if(l>.05){controlled.x+=input.x/l*controlled.speed*dt;controlled.y+=input.y/l*controlled.speed*dt;controlled.dir=input.x>=0?1:-1}
 controlled.x=Math.max(rink.x+35,Math.min(rink.x+rink.w-35,controlled.x));controlled.y=Math.max(rink.y+35,Math.min(rink.y+rink.h-35,controlled.y));
 controlled.g.setAttribute('transform',`translate(${controlled.x} ${controlled.y})`);
 for(const p of players)if(p!==controlled){
  let tx=p.homeX,ty=p.homeY;
  if(p.role==='GK'){tx=p.team==='blue'?rink.x+55:rink.x+rink.w-55;ty=Math.max(320,Math.min(570,owner?owner.y:445))}
  else if(!owner){tx=p.x;ty=p.y}
  else if(owner===p){tx=p.team==='blue'?rink.x+rink.w-40:rink.x+40;ty=445}
  else if(owner.team!==p.team){tx=owner.x+(p.homeX-owner.x)*.25;ty=owner.y+(p.homeY-owner.y)*.25}
  movePlayer(p,tx,ty,dt,p.role==='GK'?.45:.28)
 }
 if(owner)updatePuck();
}
function loop(t){const dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const joy=document.getElementById('joystick'),knob=document.getElementById('knob');
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,m=48;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}input.x=dx/m;input.y=dy/m;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});joy.addEventListener('pointerup',()=>{input.x=input.y=0;knob.style.transform='translate(-50%,-50%)'});
function pass(){if(owner!==controlled)return;const mates=players.filter(p=>p.team===controlled.team&&p!==controlled).sort((a,b)=>Math.hypot(a.x-controlled.x,a.y-controlled.y)-Math.hypot(b.x-controlled.x,b.y-controlled.y));if(mates[0])owner=mates[0]}
function shoot(){if(owner!==controlled)return;owner=null;document.getElementById('powerFill').style.width='0'}
document.getElementById('pass').onclick=pass;document.getElementById('shoot').onpointerdown=()=>{charge=0};document.getElementById('shoot').onpointerup=shoot;
document.getElementById('switch').onclick=()=>{const m=players.filter(p=>p.team===controlled.team&&p!==controlled);controlled=m.sort((a,b)=>Math.hypot(a.x-owner?.x||0,a.y-owner?.y||0)-Math.hypot(b.x-owner?.x||0,b.y-owner?.y||0))[0]||controlled};
document.getElementById('check').onclick=()=>{if(owner&&owner.team!==controlled.team&&Math.hypot(owner.x-controlled.x,owner.y-controlled.y)<70)owner=controlled};
setInterval(()=>{if(charge<1&&document.activeElement===document.getElementById('shoot'))charge=Math.min(1,charge+.05);document.getElementById('powerFill').style.width=(charge*100)+'%'},50);
function start(){document.getElementById('menu').style.display='none';document.getElementById('end').style.display='none';blue=yellow=0;time=180;document.getElementById('bs').textContent=0;document.getElementById('ys').textContent=0;make();running=true}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
</script>
</body>
</html>
